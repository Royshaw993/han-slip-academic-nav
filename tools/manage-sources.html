<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>资讯来源管理助手 · 古文字学术导航</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f0e6;color:#40372c;font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1120px;margin:auto;padding:24px 16px}h1{font-size:1.55rem;margin:0 0 6px}h2{font-size:1.15rem;margin:0 0 12px}p{margin:6px 0 12px}.muted{color:#76644f;font-size:.9rem}.toolbar,.editor{padding:16px;background:#eee4d4;border:1px solid #cdb99a;margin:16px 0}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.toolbar label{display:grid;gap:4px;min-width:190px;flex:1}.toolbar label:first-child{flex:2}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input,select,textarea{font:inherit;max-width:100%;border:1px solid #bda98d;background:#fffaf0;color:#684c35;border-radius:6px;padding:7px 10px}button{min-height:42px;cursor:pointer}button:hover{background:#e7d8c1}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #ad7762;outline-offset:2px}#newSource,.primary{background:#8e3028;color:#fff;border-color:#8e3028}#message{min-height:1.7em;overflow-wrap:anywhere}#message[data-error=true]{color:#a02622}#summary{font-weight:700;color:#8e3028}.source-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}article{background:#fffaf1;border:1px solid #d8cdbc;padding:15px;overflow-wrap:anywhere}article h3{font-size:1.05rem;margin:0 0 4px}.id{font:12px ui-monospace,monospace;color:#76644f}article a{color:#8e3028;word-break:break-all}.chips{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.chip,.status{display:inline-block;border:1px solid #cdb99a;border-radius:999px;padding:1px 8px;font-size:.82rem}.status.off{color:#8e3028}.note{white-space:pre-wrap;color:#76644f;font-size:.88rem}.rules{border-top:1px solid #d8cdbc;margin-top:10px}.rules summary{padding:7px 0;cursor:pointer;color:#684c35;font-size:.9rem}.rules .id{margin:3px 0 7px}.rule-label{font-size:.88rem;margin:5px 0}.rules pre{margin:5px 0 10px;padding:8px;background:#f5f0e6;border:1px solid #d8cdbc;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,monospace;color:#5f4b39}form,.advanced-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}.field{display:grid;gap:4px}.full{grid-column:1/-1}.field small{color:#76644f}.categories{display:flex;gap:12px;flex-wrap:wrap;padding:7px 0}.categories label{display:flex;gap:5px;align-items:center}.advanced{border:1px solid #cdb99a;background:#f8f2e8}.advanced>summary{padding:10px 12px;cursor:pointer;font-weight:700}.advanced-grid{padding:4px 12px 14px}.category-keyword-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.category-keyword-grid:empty::before{content:"勾选门类后在这里显示对应输入框。";color:#76644f;font-size:.9rem}input[type=checkbox]{width:19px;height:19px;accent-color:#8e3028}textarea{min-height:80px;resize:vertical}[hidden]{display:none!important}@media(max-width:650px){main{padding:16px 12px}.toolbar{align-items:stretch}.toolbar label{min-width:100%}form,.advanced-grid,.category-keyword-grid{grid-template-columns:1fr}.full{grid-column:auto}.source-grid{grid-template-columns:1fr}}
</style>
<main>
<h1>资讯来源管理助手</h1><p class="muted">仅管理 <code>data/sources.json</code>。保存前会校验并自动备份；本页不修改正式动态、候选或已见记录，也没有发布入口。</p>
<div class="toolbar"><label>关键词搜索<input id="search" type="search" placeholder="来源名称、ID、URL、关键词或备注"></label><label>门类筛选<select id="categoryFilter"><option value="">全部门类</option></select></label><button id="newSource" type="button">新增来源</button><button id="refresh" type="button">重新读取</button></div>
<p id="summary" role="status" aria-live="polite">正在读取来源……</p><p id="message" role="status" aria-live="polite"></p>
<section id="editor" class="editor" hidden><h2 id="editorTitle">新增来源</h2>
<form id="sourceForm" novalidate>
<label class="field">名称<input id="sourceName" required maxlength="200" autocomplete="off"></label>
<label class="field">URL<input id="sourceUrl" type="url" required maxlength="2000" placeholder="https://example.org/"></label>
<div class="field full"><span>门类（可多选，至少选择一个）</span><div id="categories" class="categories"></div></div>
<label class="field full">关键词<textarea id="keywords" required></textarea><small>用于从该来源中筛选相关学术内容，可用逗号或换行分隔。</small></label>
<label class="field full">备注（可选）<textarea id="note" maxlength="2000"></textarea></label>
<label class="full"><input id="enabled" type="checkbox" checked> 启用此来源</label>
<details id="advancedSettings" class="advanced full"><summary>高级设置 ▾</summary><div class="advanced-grid">
<label class="field">id<input id="sourceId" required maxlength="80" pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,79}"><small>根据名称自动生成；如重复，请手工调整。</small></label>
<label class="field">sourceType<input id="sourceType" required maxlength="100" value="official"></label>
<label class="field">priority<input id="priority" type="number" min="0" max="99" step="1" value="5"><small>数字越小越优先。</small></label>
<label class="field">maxDetailRequests<input id="maxDetailRequests" type="number" min="0" max="100" step="1" value="6"></label>
<div class="field full"><span>门类专用关键词（可选）</span><small>仅显示已勾选的门类；可用逗号或换行分隔，保存时自动转换为 categoryKeywords。</small><div id="categoryKeywordFields" class="category-keyword-grid"></div></div>
<label class="full"><input id="manualReview" type="checkbox"> 标记为人工复核（测试来源时不联网）</label>
</div></details>
<div class="actions full"><button class="primary" type="submit">保存来源</button><button id="cancel" type="button">取消</button></div>
</form></section><section id="sourceList" class="source-grid" aria-live="polite"></section>
</main>
<script nonce="__SOURCE_TOKEN__">
"use strict";
const token="__SOURCE_TOKEN__",$=selector=>document.querySelector(selector),labels={};
const categoryExamples={oracle:["甲骨","甲骨文","卜辞","殷墟"],bronze:["金文","青铜器","铭文"],stone:["石刻","碑刻","墓志","拓片"],slips:["简牍","汉简","竹简"],silk:["帛书","马王堆","楚帛书"]};
const idPhrases=[["中国","zhongguo"],["社会科学院","shehui-kexueyuan"],["科学院","kexueyuan"],["古文字","guwenzi"],["甲骨文","jiaguwen"],["金文","jinwen"],["石刻","shike"],["简牍","jiandu"],["简帛","jianbo"],["帛书","boshu"],["考古","kaogu"],["清华","qinghua"],["北京","beijing"],["复旦","fudan"],["武汉","wuhan"],["吉林","jilin"],["山东","shandong"],["郑州","zhengzhou"],["湖南","hunan"],["西北","xibei"],["大学","daxue"],["学院","xueyuan"],["研究中心","yanjiu-zhongxin"],["研究所","yanjiusuo"],["研究","yanjiu"],["博物馆","bowuguan"],["文物","wenwu"],["学术","xueshu"],["资讯","zixun"],["数据库","shujuku"],["中心","zhongxin"],["官方","official"]];
let sources=[],revision="",editingIndex=-1,busy=false,idManuallyEdited=false,categoryKeywordDraft={};
function list(value){const values=Array.isArray(value)?value:(typeof value==="string"?value.split(/[\n,，]/):[]);return[...new Set(values.map(item=>String(item).trim()).filter(Boolean))]}
function selectedCategories(){return[...document.querySelectorAll("input[name=category]:checked")].map(input=>input.value)}
function urlKey(value){try{const url=new URL(value.trim()),path=url.pathname.replace(/\/+$/,"")||"/";return`${url.protocol.toLowerCase()}//${url.host.toLowerCase()}${path}${url.search}`}catch{return value.trim().toLowerCase().replace(/\/+$/,"")}}
function normalizeUrl(value){const trimmed=value.trim();return !/^[a-z][a-z0-9+.-]*:\/\//i.test(trimmed)&&/^(?:www\.)?[a-z0-9-]+(?:\.[a-z0-9-]+)+(?:[\/:?#]|$)/i.test(trimmed)?`https://${trimmed}`:trimmed}
function slug(value){return value.normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")}
function sourceIdSuggestion(name,url){let value=String(name||"");for(const[text,replacement]of idPhrases)value=value.split(text).join(`-${replacement}-`);let result=slug(value);if(!result){try{result=slug(new URL(normalizeUrl(url)).hostname.replace(/^www\./i,""))}catch{result="source"}}return(result||"source").slice(0,80).replace(/-+$/g,"")}
function notice(value,error=false){$("#message").textContent=value;$("#message").dataset.error=String(error)}
function updateGeneratedId(){if(editingIndex>=0||idManuallyEdited)return;const suggestion=sourceIdSuggestion($("#sourceName").value,$("#sourceUrl").value);$("#sourceId").value=suggestion;if(sources.some(source=>source.id===suggestion))notice(`自动生成的 id“${suggestion}”已存在，请在高级设置中调整。`,true)}
async function api(path,payload){const options={headers:{"X-Source-Token":token}};if(payload!==undefined){options.method="POST";options.headers["Content-Type"]="application/json";options.body=JSON.stringify(payload)}const response=await fetch(path,options),value=await response.json();if(!response.ok)throw new Error(value.error||"请求失败");return value}
function setBusy(value){busy=value;document.querySelectorAll("button,input,select,textarea").forEach(control=>{control.disabled=value})}
function categoryText(category){return labels[category]||category}function displayName(name){return String(name||"").replace(/\s*\[home\]\s*$/i,"").trim()}
function renderCategoryFilter(){const filter=$("#categoryFilter"),old=filter.value;filter.replaceChildren(new Option("全部门类",""));Object.entries(labels).forEach(([value,label])=>filter.append(new Option(label,value)));filter.value=old}
function matches(source){const query=$("#search").value.trim().toLowerCase(),category=$("#categoryFilter").value;if(category&&!(source.categories||[]).includes(category))return false;if(!query)return true;return[source.id,source.name,source.url,source.sourceType,source.note,list(source.categories).join(" "),list(source.keywords).join(" ")].join(" ").toLowerCase().includes(query)}
function addText(parent,value,className=""){const node=document.createElement("div");node.textContent=value;node.className=className;parent.append(node)}
function appendRuleJson(parent,label,value){addText(parent,label,"rule-label");const node=document.createElement("pre");node.textContent=JSON.stringify(value,null,2);parent.append(node)}
function render(){const container=$("#sourceList");container.replaceChildren();const shown=sources.map((source,index)=>({source,index})).filter(item=>matches(item.source));$("#summary").textContent=`共 ${sources.length} 条来源，当前显示 ${shown.length} 条；已启用 ${sources.filter(source=>source.enabled).length} 条。`;for(const{source,index}of shown){const card=document.createElement("article"),title=document.createElement("h3");title.textContent=displayName(source.name);card.append(title);const link=document.createElement("a");link.href=source.url;link.target="_blank";link.rel="noopener noreferrer";link.textContent=source.url;card.append(link);const chips=document.createElement("div");chips.className="chips";list(source.categories).forEach(category=>{const chip=document.createElement("span");chip.className="chip";chip.textContent=categoryText(category);chips.append(chip)});card.append(chips);addText(card,`${source.enabled?"已启用":"已停用"} · priority ${source.priority} · ${source.sourceType}`,`status${source.enabled?"":" off"}`);addText(card,`备注：${source.note||"无"}`,"note");const rules=document.createElement("details");rules.className="rules";const ruleSummary=document.createElement("summary");ruleSummary.textContent="规则详情 ▾";rules.append(ruleSummary);addText(rules,`id：${source.id}`,"id");addText(rules,`keywords：${list(source.keywords).join("、")||"无"}`,"rule-label");appendRuleJson(rules,"categoryKeywords：",source.categoryKeywords||{});addText(rules,`maxDetailRequests：${source.maxDetailRequests??6}`,"rule-label");addText(rules,`manualReview：${source.manualReview===true}`,"rule-label");const standardKeys=new Set(["id","name","url","categories","keywords","note","enabled","sourceType","priority","maxDetailRequests","manualReview","categoryKeywords"]),extra=Object.fromEntries(Object.entries(source).filter(([key])=>!standardKeys.has(key)));if(Object.keys(extra).length)appendRuleJson(rules,"其他技术字段：",extra);card.append(rules);const actions=document.createElement("div");actions.className="actions";[["edit","编辑"],[source.enabled?"disable":"enable",source.enabled?"停用":"启用"],["test","测试来源"]].forEach(([action,text])=>{const button=document.createElement("button");button.type="button";button.dataset.action=action;button.dataset.index=String(index);button.textContent=text;actions.append(button)});card.append(actions);container.append(card)}if(!shown.length)addText(container,"没有符合筛选条件的来源。","muted")}
function syncCategoryKeywordDraft(){document.querySelectorAll("textarea[data-category-keywords]").forEach(input=>{categoryKeywordDraft[input.dataset.categoryKeywords]=list(input.value)})}
function renderCategoryKeywordFields(selected=selectedCategories(),sync=true){if(sync)syncCategoryKeywordDraft();const container=$("#categoryKeywordFields");container.replaceChildren();selected.forEach(category=>{const field=document.createElement("label"),input=document.createElement("textarea");field.className="field";input.dataset.categoryKeywords=category;input.value=list(categoryKeywordDraft[category]).join("\n");input.placeholder=(categoryExamples[category]||[]).join("、");field.append(document.createTextNode(`${categoryText(category)}：`),input);container.append(field)})}
function renderCategoryChecks(selected,sync=true){const container=$("#categories");container.replaceChildren();Object.entries(labels).forEach(([value,label])=>{const labelNode=document.createElement("label"),input=document.createElement("input");input.type="checkbox";input.name="category";input.value=value;input.checked=selected.includes(value);input.addEventListener("change",()=>renderCategoryKeywordFields());labelNode.append(input,document.createTextNode(label));container.append(labelNode)});renderCategoryKeywordFields(selected,sync)}
function resetForm(){editingIndex=-1;idManuallyEdited=false;categoryKeywordDraft={};$("#editorTitle").textContent="新增来源";$("#sourceForm").reset();$("#advancedSettings").open=false;$("#enabled").checked=true;$("#sourceType").value="official";$("#priority").value="5";$("#maxDetailRequests").value="6";renderCategoryChecks([],false);updateGeneratedId();$("#editor").hidden=false;$("#sourceName").focus()}
function edit(index){const source=sources[index];editingIndex=index;idManuallyEdited=true;$("#categoryKeywordFields").replaceChildren();categoryKeywordDraft=Object.fromEntries(Object.entries(source.categoryKeywords||{}).map(([category,terms])=>[category,list(terms)]));$("#editorTitle").textContent=`编辑来源：${source.name}`;$("#sourceForm").reset();$("#advancedSettings").open=false;$("#sourceId").value=source.id||"";$("#sourceName").value=source.name||"";$("#sourceUrl").value=source.url||"";$("#sourceType").value=source.sourceType||"official";$("#priority").value=source.priority??5;$("#maxDetailRequests").value=source.maxDetailRequests??6;$("#keywords").value=list(source.keywords).join("\n");$("#note").value=source.note||"";$("#manualReview").checked=source.manualReview===true;$("#enabled").checked=source.enabled!==false;renderCategoryChecks(list(source.categories),false);$("#editor").hidden=false;window.scrollTo({top:0,behavior:"smooth"})}
function readForm(){const existing=editingIndex>=0?{...sources[editingIndex]}:{};syncCategoryKeywordDraft();const categoryKeywords=Object.fromEntries(Object.entries(categoryKeywordDraft).map(([category,terms])=>[category,list(terms)]).filter(([,terms])=>terms.length));return{...existing,id:$("#sourceId").value.trim(),name:$("#sourceName").value.trim(),url:normalizeUrl($("#sourceUrl").value),sourceType:$("#sourceType").value.trim()||"official",priority:Number($("#priority").value),maxDetailRequests:Number($("#maxDetailRequests").value),categories:selectedCategories(),keywords:list($("#keywords").value),categoryKeywords,note:$("#note").value.trim(),manualReview:$("#manualReview").checked,enabled:$("#enabled").checked}}
function validateClient(source){if(!source.name)throw new Error("名称不能为空。");if(!/^[A-Za-z0-9][A-Za-z0-9_-]{0,79}$/.test(source.id))throw new Error("自动生成的 id 无效，请在高级设置中调整。");let parsed;try{parsed=new URL(source.url)}catch{throw new Error("URL 无效，请输入网站地址。")}if(!["http:","https:"].includes(parsed.protocol)||!parsed.hostname)throw new Error("URL 必须是带主机名的 http 或 https 地址。");if(!source.categories.length)throw new Error("请至少选择一个门类。");if(!source.keywords.length)throw new Error("请填写用于筛选学术内容的关键词。");if(!Number.isInteger(source.priority)||source.priority<0||source.priority>99)throw new Error("priority 必须是 0–99 的整数。");if(!Number.isInteger(source.maxDetailRequests)||source.maxDetailRequests<0||source.maxDetailRequests>100)throw new Error("maxDetailRequests 必须是 0–100 的整数。");const others=sources.filter((_,index)=>index!==editingIndex);if(others.some(item=>item.id===source.id))throw new Error(`来源 id 重复：${source.id}。请在高级设置中调整。`);if(others.some(item=>urlKey(item.url)===urlKey(source.url)))throw new Error(`来源 URL 重复：${source.url}`)}
async function saveAll(nextSources){const result=await api("/api/save",{revision,sources:nextSources});revision=result.revision;await load()}async function load(){const result=await api("/api/sources");sources=result.sources||[];revision=result.revision;Object.assign(labels,result.categories||{});renderCategoryFilter();render()}async function run(action){if(busy)return;setBusy(true);try{await action()}catch(error){notice(error.message||String(error),true)}finally{setBusy(false)}}
$("#newSource").addEventListener("click",resetForm);$("#cancel").addEventListener("click",()=>{$("#editor").hidden=true});$("#refresh").addEventListener("click",()=>run(async()=>{await load();notice("已重新读取 sources.json。")}));$("#search").addEventListener("input",render);$("#categoryFilter").addEventListener("change",render);$("#sourceName").addEventListener("input",updateGeneratedId);$("#sourceId").addEventListener("input",()=>{idManuallyEdited=true});$("#sourceUrl").addEventListener("input",updateGeneratedId);$("#sourceUrl").addEventListener("blur",()=>{$("#sourceUrl").value=normalizeUrl($("#sourceUrl").value);updateGeneratedId()});
$("#sourceForm").addEventListener("submit",event=>{event.preventDefault();run(async()=>{const source=readForm();validateClient(source);const next=sources.map((item,index)=>index===editingIndex?source:item);if(editingIndex<0)next.push(source);await saveAll(next);$("#editor").hidden=true;notice("来源已保存；sources.review-backup.json 已保留保存前版本。")})});
$("#sourceList").addEventListener("click",event=>{const button=event.target.closest("button[data-action]");if(!button)return;const index=Number(button.dataset.index),action=button.dataset.action;if(action==="edit"){edit(index);return}if(action==="test"){run(async()=>{const result=await api("/api/test-source",{source:sources[index]});notice(result.message+(result.matches?.length?` 示例：${result.matches.join("；")}`:""),result.status==="failed")});return}run(async()=>{const next=sources.map((source,itemIndex)=>itemIndex===index?{...source,enabled:action==="enable"}:source);await saveAll(next);notice(`来源已${action==="enable"?"启用":"停用"}。`)})});
renderCategoryChecks([]);run(async()=>{await load();notice("请选择来源进行编辑，或新增来源。")});
</script></html>
